<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bulldog: Dark City</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main id="game" aria-label="Bulldog: Dark City">
      <section
        id="menu-interface"
        class="menu-interface"
        aria-label="Hauptmenü"
        aria-hidden="true"
      >
        <nav class="menu-interface__actions" aria-label="Spielmenü">
          <button class="html-menu-button" type="button" data-menu-action="start">
            <img src="/img/ui/menu/icons/start-paw.png" alt="" />
            <span>START</span>
          </button>
          <button class="html-menu-button" type="button" data-menu-action="options">
            <img src="/img/ui/menu/icons/settings-gear.png" alt="" />
            <span>OPTIONEN</span>
          </button>
          <button class="html-menu-button" type="button" data-menu-action="upgrades">
            <img src="/img/ui/menu/icons/upgrades-arrow.png" alt="" />
            <span>UPGRADES</span>
          </button>
          <button class="html-menu-button" type="button" data-menu-action="extras">
            <img src="/img/ui/menu/icons/extras-star.png" alt="" />
            <span>EXTRAS</span>
          </button>
        </nav>
        <p class="menu-interface__version menu-interface__version--hidden">
          vol.1.0
        </p>
        <p id="menu-input-hint" class="menu-interface__input-hint">
          W/S · ENTER / LEERTASTE
        </p>
        <div
          id="locked-feature-dialog"
          class="locked-feature-dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="locked-feature-title"
          aria-describedby="locked-feature-message locked-feature-note"
          aria-hidden="true"
        >
          <div class="locked-feature-dialog__panel">
            <h2 id="locked-feature-title">BEREICH NOCH NICHT ERREICHT</h2>
            <p id="locked-feature-message"></p>
            <aside id="locked-feature-note">
              SIDE NOTE: DAS SPIEL SOLLTE ZUERST DURCHGESPIELT WERDEN.
            </aside>
            <button type="button" data-dialog-close>SCHLIESSEN</button>
          </div>
        </div>
      </section>
      <button
        id="mute-toggle"
        class="mute-toggle"
        type="button"
        aria-label="Alle Töne stummschalten"
        aria-pressed="false"
        title="Alle Töne stummschalten"
      >🔊</button>
      <a
        id="github-profile-link"
        class="github-profile-link github-profile-link--hidden"
        href="https://github.com/andrewojak1618-debug"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub-Profil von Andre Wojak öffnen"
        aria-hidden="true"
        tabindex="-1"
        title="GitHub-Profil öffnen"
      >
        <span class="github-profile-link__label">GITHUB</span>
        <img
          src="/img/ui/menu/social/github.png"
          alt=""
          aria-hidden="true"
        />
      </a>
      <footer
        id="menu-legal-navigation"
        class="site-footer"
        aria-label="Rechtliche Navigation"
        aria-hidden="true"
      >
        <a
          class="legal-navigation-link"
          href="./impressum.html"
          tabindex="-1"
        >Impressum</a>
      </footer>
    </main>
    <section
      id="level-loading-overlay"
      class="level-loading-overlay"
      aria-live="polite"
      aria-hidden="true"
    >
      <span class="level-loading-overlay__spinner" aria-hidden="true"></span>
      <p data-loading-message>LEVEL WIRD GELADEN ...</p>
    </section>
    <section
      id="orientation-notice"
      class="orientation-notice"
      aria-live="polite"
      aria-hidden="true"
    >
      <span class="orientation-notice__icon" aria-hidden="true">↻</span>
      <h1>Bitte Gerät drehen</h1>
      <p>Bulldog: Dark City wird im Querformat gespielt.</p>
    </section>
    <script type="module" src="/script.js"></script>
  </body>
</html>
